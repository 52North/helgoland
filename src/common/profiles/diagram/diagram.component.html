<ng-template #modalGeometryViewer let-c="close()" let-d="dismiss()">
  <div class="modal-header">
    <h4 class="modal-title">Station location</h4>
    <button type="button" class="close" aria-label="Close" (click)="d">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body profileGeometryViewer">
    <n52-geometry-map-viewer [mapId]="'mapGeometryViewerModal'" [geometry]="geometry"></n52-geometry-map-viewer>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-light" (click)="c">Close</button>
  </div>
</ng-template>

<div class="container-fluid" *ngIf="datasetIds.length > 0">
  <div class="row row-offcanvas row-offcanvas-right" [ngClass]="{active: legendToggled}">
    <div class="col-12 col-md-12 col-xl-12 diagram-wrapper">
      <button type="button" class="btn btn-primary btn-sm d-md-none legend-button"
        (click)="legendToggled = !legendToggled;">{{'timeseries.diagram.legend.header' | translate}}</button>
      <div class="chart" *ngIf="profilesView === 'diagram' && datasetIds.length !== 0">
        <app-custom-profile-graph [datasetIds]="datasetIds" [selectedDatasetIds]="selectedIds"
          [datasetOptions]="datasetOptions"></app-custom-profile-graph>
      </div>
      <n52-profile-table *ngIf="profilesView === 'table' && datasetIds.length !== 0" [datasetIds]="datasetIds" [selectedDatasetIds]="selectedIds"></n52-profile-table>
      <div class="control-bar">
        <div class="btn-toolbar" role="toolbar" aria-label="Toolbar with button groups">
          <div class="btn-group btn-group-toggle d-flex justify-content-center row ml-5" ngbRadioGroup name="radioBasic"
            [(ngModel)]="profilesView">
            <label ngbButtonLabel class="col btn-light">
              <input ngbButton type="radio" value="diagram"><span class="fa fa-chart-line"></span>
            </label>
            <label ngbButtonLabel class="col btn-light">
              <input ngbButton type="radio" value="table"><span class="fa fa-table"></span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-9 col-md-4 col-xl-3 sidebar-offcanvas" id="sidebar">
    <div class="legend" *ngIf="datasetIds.length !== 0">
      <h3 class="header d-none d-md-block">{{'timeseries.diagram.legend.header' | translate}}</h3>
      <div class="legend-entries">
        <div *ngFor="let id of datasetIds">
          <n52-custom-profile-entry [datasetId]="id" [selected]="isSelected(id)" [datasetOptions]="datasetOptions.get(id)"
            (onDeleteDatasetOptions)="deleteProfileOptions($event)" (onSelectDataset)="selectProfile($event, id)"
            (onUpdateOptions)="updateOptions($event, id)" (onEditOptions)="editOption($event)"
            (onShowGeometry)="showGeometry($event)" (onOpenInCombiView)="openCombiView($event)"></n52-custom-profile-entry>
        </div>
      </div>
    </div>
  </div>
</div>

<n52-permalink-button *ngIf="datasetIds.length !== 0" [generatedUrlFunction]="permalinkSrvc.createPermalink"></n52-permalink-button>


<div *ngIf="datasetIds.length === 0" class="container n52-alert">
  <div class="alert alert-primary" role="alert">
    <a routerLink='/profiles/map-selection' class='alert-link'>{{'profiles.hint.select-profile' | translate}}</a>
  </div>
</div>
